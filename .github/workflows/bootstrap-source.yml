name: Bootstrap FairScreen source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/fairscreen-source-bootstrap.tar.gz"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract FairScreen source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fairscreen-source
          mkdir -p /tmp/fairscreen-source
          tar -xzf bootstrap/fairscreen-source-bootstrap.tar.gz -C /tmp/fairscreen-source

      - name: Replace bootstrap files with application source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.git' \
            --exclude='.github/workflows' \
            /tmp/fairscreen-source/ ./
          rm -rf bootstrap INITIALIZING.md

      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add FairScreen application source"
          git push
