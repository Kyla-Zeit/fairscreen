name: Apply final FairScreen browser selectors

on:
  push:
    branches:
      - main
    paths:
      - maintenance/final-browser-selectors.patch
      - .github/workflows/apply-final-browser-selectors.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply selector patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check maintenance/final-browser-selectors.patch
          git apply maintenance/final-browser-selectors.patch
          rm -f maintenance/final-browser-selectors.patch
          rmdir maintenance 2>/dev/null || true

      - name: Commit corrected selectors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use the accessible answer-text label in browser tests"
          git push
