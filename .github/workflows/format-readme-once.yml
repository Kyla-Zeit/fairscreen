name: Format README once

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/format-readme-once.yml

permissions:
  contents: write

jobs:
  format-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove trailing whitespace
        shell: bash
        run: |
          perl -pi -e 's/[ \t]+$//' README.md

      - name: Commit formatted README
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Format README"
          git push
