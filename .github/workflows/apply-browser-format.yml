name: Apply FairScreen browser-test formatting

on:
  push:
    branches:
      - main
    paths:
      - maintenance/format-browser-test.patch
      - .github/workflows/apply-browser-format.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply formatting patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check maintenance/format-browser-test.patch
          git apply maintenance/format-browser-test.patch
          rm -f maintenance/format-browser-test.patch
          rmdir maintenance 2>/dev/null || true

      - name: Commit formatted test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format current browser tests"
          git push
