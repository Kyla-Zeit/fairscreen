name: Apply current FairScreen browser-test expectations

on:
  push:
    branches:
      - main
    paths:
      - maintenance/browser-test-updates.patch
      - .github/workflows/apply-browser-test-updates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply verified browser-test patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check maintenance/browser-test-updates.patch
          git apply maintenance/browser-test-updates.patch
          rm -f maintenance/browser-test-updates.patch
          rmdir maintenance 2>/dev/null || true

      - name: Commit updated browser tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update browser tests for current interview and storage behavior"
          git push
