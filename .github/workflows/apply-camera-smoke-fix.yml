name: Apply FairScreen camera smoke fix

on:
  push:
    branches:
      - main
    paths:
      - maintenance/stabilize-camera-smoke.patch
      - .github/workflows/apply-camera-smoke-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply camera smoke patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check maintenance/stabilize-camera-smoke.patch
          git apply maintenance/stabilize-camera-smoke.patch
          rm -f maintenance/stabilize-camera-smoke.patch
          rmdir maintenance 2>/dev/null || true

      - name: Commit stable browser test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize camera worker browser smoke test"
          git push
